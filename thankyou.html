<!DOCTYPE HTML>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Q/A via Email</title>
<link rel="icon" type="image/x-icon" href="images/EnMesh.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

</head>
<body>
<div class="container text-center">

    <!-- 導覽列容器 -->
    <div id="content-container"></div>

    <!-- 內容區塊 -->
    <section class="section-content py-5 mt-3">


        
        <!-- 圖片容器：加一點 padding 讓圖片像是在圖紙上 -->
        <div class="bg-transparent p-2 d-inline-block rounded shadow-sm border-2 mx-auto text-center">
		    <h1 class="mb-4"><strong>Thank you</strong></h1>
			<p>Your message has been successfully received. We appreciate you reaching out and will get back to you as soon as possible.</p>	
        </div>

    </section>

</div><!-- Ended container -->

<a href="#" id="backToTop">TOP &#129137;</a>

<script>
    let backToTop = document.getElementById("backToTop");
    window.onscroll = function() {
        if (document.documentElement.scrollTop > 300) {
            backToTop.style.display = "block";
        } else {
            backToTop.style.display = "none";
        }
    };
    backToTop.addEventListener("click", function(event) {
        event.preventDefault();
        window.scrollTo({ top: 0, behavior: "smooth" });
    });
</script>
	

<!-- footer -->
<div id="footer-container"></div>
	
<script>
  fetch('header.html')
    .then(response => {
      if (!response.ok) throw new Error('無法載入檔案');
      return response.text();
    })
    .then(htmlText => {
      document.getElementById('content-container').innerHTML = htmlText;
    })
    .catch(error => {
      console.error('載入內容時出錯:', error);
    });
</script>

<!-- footer.html)-->
<script>
  // 獲取外部檔案的內容
  fetch('footer.html')
    .then(response => {
      // 確保回應成功
      if (!response.ok) {
        throw new Error('無法載入檔案');
      }
      // 將回應解析為純文字
      return response.text();
    })
    .then(htmlText => {
      // 找到容器元素並將獲取的 HTML 文字設定為其內容
      document.getElementById('footer-container').innerHTML = htmlText;
    })
    .catch(error => {
      console.error('載入內容時出錯:', error);
      document.getElementById('footer-container').innerHTML = '<p>載入內容失敗。</p>';
    });
</script>

</body>
</html>
