<html lang="en">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Q/A via Email</title>
<link rel="icon" type="image/x-icon" href="images/EnMesh.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

</head>
<body>
<div class="container text-center">

    <!-- 導覽列容器 -->
    <div id="content-container"></div>

    <!-- 內容區塊 -->
    <section class="section-content py-5 mt-3">

    <h2 class="mb-4"><strong>Send your questions to us</strong></h2>
        
        <!-- 圖片容器：加一點 padding 讓圖片像是在圖紙上 -->
        <div class="w-100 bg-transparent p-2 d-inline-block rounded shadow-sm border-2 mx-auto text-center">
		

			<div class="w-100 bg-transparent p-4 rounded shadow-sm border mx-auto" style="max-width: 600px;">

				<form id="form" action="https://api.web3forms.com/submit" method="POST">

				
					<!-- Web3Forms Access Key -->
					<input type="hidden" name="access_key" value="f7dd8224-f2fb-4c40-9c6c-c8bb26236e9e">

					<!-- Redirect URL -->
					<input type="hidden" name="redirect" value="https://en-mesh.com/thankyou.html">

					<!-- Name -->
					<div class="w-50 mb-3 text-start">
						<label for="name" class="form-label fw-bold">Name</label>
						<input 
							type="text" 
							class="form-control" 
							id="name" 
							name="name" 
							placeholder="Enter your name"
							required>
					</div>

					<!-- Email -->
					<div class="w-50 mb-3 text-start">
						<label for="email" class="form-label fw-bold">Email</label>
						<input 
							type="email" 
							class="form-control" 
							id="email" 
							name="email" 
							placeholder="Enter your email"
							required>
					</div>

					<!-- Question -->
					<div class="mb-3 text-start">
						<label for="message" class="form-label fw-bold">Questions</label>
						<textarea 
							class="form-control" 
							id="message" 
							name="message" 
							rows="5"
							placeholder="Type your questions here..."
							required></textarea>
					</div>
					<!-- hCaptcha Checkbox Container Element -->
					<div class="h-captcha mb-3" data-captcha="true"></div>
					<script src="https://web3forms.com/client/script.js" async defer></script>


					<!-- Submit Button -->
					<div class="text-center">
						<button type="submit" class="btn btn-primary px-4 px-5 py-2 fw-bold">
							Submit
						</button>
					</div>

				</form>

			</div>

			<script>
			const form = document.getElementById('form');
			const submitBtn = form.querySelector('button[type="submit"]');

			form.addEventListener('submit', async (e) => {
				e.preventDefault();

				const formData = new FormData(form);

				const originalText = submitBtn.textContent;

				submitBtn.textContent = "Sending...";
				submitBtn.disabled = true;

				try {
					const response = await fetch("https://api.web3forms.com/submit", {
						method: "POST",
						body: formData
					});

					if (response.ok) {
						window.location.href = "https://en-mesh.com/thankyou.html";
					} else {
						const data = await response.json();
						alert("Error: " + data.message);
					}

				} catch (error) {
					alert("Something went wrong. Please try again.");
				} finally {
					submitBtn.textContent = originalText;
					submitBtn.disabled = false;
				}
			});
			</script>

			
        </div>

    </section>



</div><!-- Ended container -->

<a href="#" id="backToTop">TOP &#129137;</a>

<script>
    let backToTop = document.getElementById("backToTop");
    window.onscroll = function() {
        if (document.documentElement.scrollTop > 300) {
            backToTop.style.display = "block";
        } else {
            backToTop.style.display = "none";
        }
    };
    backToTop.addEventListener("click", function(event) {
        event.preventDefault();
        window.scrollTo({ top: 0, behavior: "smooth" });
    });
</script>
	

<!-- footer -->
<div id="footer-container"></div>
	
<script>
  fetch('header.html')
    .then(response => {
      if (!response.ok) throw new Error('無法載入檔案');
      return response.text();
    })
    .then(htmlText => {
      document.getElementById('content-container').innerHTML = htmlText;
    })
    .catch(error => {
      console.error('載入內容時出錯:', error);
    });
</script>

<!-- footer.html)-->
<script>
  // 獲取外部檔案的內容
  fetch('footer.html')
    .then(response => {
      // 確保回應成功
      if (!response.ok) {
        throw new Error('無法載入檔案');
      }
      // 將回應解析為純文字
      return response.text();
    })
    .then(htmlText => {
      // 找到容器元素並將獲取的 HTML 文字設定為其內容
      document.getElementById('footer-container').innerHTML = htmlText;
    })
    .catch(error => {
      console.error('載入內容時出錯:', error);
      document.getElementById('footer-container').innerHTML = '<p>載入內容失敗。</p>';
    });
</script>

</body>
</html>
